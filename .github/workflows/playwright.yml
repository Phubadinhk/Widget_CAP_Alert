name: Performance Test

on:
  schedule:
    - cron: '0 2,11 * * *' # 09:00 และ 18:00 เวลาไทย
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    env:
      KIOSK_TOKEN: ${{ secrets.KIOSK_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run performance test
        run: npx playwright test tests/home.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-performance-report
          path: playwright-report/
          retention-days: 7

      - name: Send report to Microsoft Teams
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" \
            -d "{
              \"text\": \"Playwright Performance Report\nStatus: ${STATUS}\nRepository: ${{ github.repository }}\nRun Report: ${RUN_URL}\"
            }" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"