name: Performance Test

on:
  schedule:
    - cron: "0 2,11 * * *" # 09:00 และ 18:00 เวลาไทย
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    env:
      KIOSK_TOKEN: ${{ secrets.KIOSK_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run performance test
        run: npx playwright test tests/home.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-performance-report
          path: playwright-report/
          retention-days: 7

      - name: Send report to Microsoft Teams
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"message\",
              \"attachments\": [
                {
                  \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                  \"content\": {
                    \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                    \"type\": \"AdaptiveCard\",
                    \"version\": \"1.4\",
                    \"body\": [
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Playwright Performance Report\",
                        \"weight\": \"Bolder\",
                        \"size\": \"Medium\"
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Status: ${STATUS}\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Repository: ${{ github.repository }}\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Run Report: ${RUN_URL}\",
                        \"wrap\": true
                      }
                    ]
                  }
                }
              ]
            }" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"