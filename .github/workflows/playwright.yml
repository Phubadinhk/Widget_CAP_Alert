name: Performance Test

on:
  schedule:
    - cron: "11 0 * * *" # 07:11 ไทย
    - cron: "32 8 * * *" # 15:32 ไทย
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    env:
      KIOSK_TOKEN: ${{ secrets.KIOSK_TOKEN }}
      RUN_DATE: ${{ github.run_id }}
      RUN_START_TIME_ONLY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Set run datetime
        shell: bash
        run: |
          echo "RUN_DATE=$(TZ=Asia/Bangkok date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "RUN_START_TIME_ONLY=$(TZ=Asia/Bangkok date +'%H:%M:%S')" >> $GITHUB_ENV

      - name: Prepare report folders
        shell: bash
        run: |
          mkdir -p reports
          mkdir -p reports/screenshots

      - name: Run Home performance test
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test tests/home.spec.ts | tee reports/home-report.txt

      - name: Run Alert History performance test
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test tests/alert_history.spec.ts | tee reports/alert_history-report.txt

      - name: Run Danger performance test
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test tests/danger.spec.ts | tee reports/danger-report.txt

      - name: Run Five Day performance test
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test tests/five-day.spec.ts | tee reports/five-day-report.txt

      - name: Run Rainfall performance test
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test tests/rainfall.spec.ts | tee reports/rainfall-report.txt

      - name: Run Temperature performance test
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test tests/temperature.spec.ts | tee reports/temperature-report.txt

      - name: Run Weather Province performance test
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test tests/weather_province.spec.ts | tee reports/weather_province-report.txt

      - name: Create Excel performance report
        if: always()
        shell: bash
        run: |
          pip install openpyxl

          python - <<'PY'
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from openpyxl import Workbook
          from openpyxl.styles import PatternFill, Font, Alignment
          from openpyxl.utils import get_column_letter

          run_date = os.environ.get("RUN_DATE", "")
          current_time = os.environ.get("RUN_START_TIME_ONLY", "")

          files = [
              ("home", "MainPage"),
              ("alert_history", "DisasterAlertHistory"),
              ("danger", "DangerSituation"),
              ("five-day", "wrf5Day"),
              ("rainfall", "CumulativeRainfall"),
              ("temperature", "wrf24hr"),
              ("weather_province", "WeatherByProvincePage"),
          ]

          wb = Workbook()
          wb.remove(wb.active)

          headers = [
              "RunDate",
              "ScheduleTime",
              "RunNo",
              "Target",
              "LoadTimeSec",
              "Success",
              "Failed",
              "TotalTimeSec",
              "AverageTimeSec",
              "MedianTimeSec",
              "MinTimeSec",
              "MaxTimeSec",
              "ErrorType",
              "ErrorDetail",
          ]

          header_fill = PatternFill(start_color="D9EAF7", end_color="D9EAF7", fill_type="solid")
          summary_fill = PatternFill(start_color="FFF2CC", end_color="FFF2CC", fill_type="solid")
          fail_fill = PatternFill(start_color="F4CCCC", end_color="F4CCCC", fill_type="solid")
          bold_font = Font(bold=True)

          def parse_success_line(text):
              patterns = [
                  (r"Run ที่ (\d+): ([\d.]+) s", "run"),
                  (r"Run (\d+) \| Province ([^:]+): ([\d.]+) s", "target"),
                  (r"Run (\d+) \| Geocode ([^:]+): ([\d.]+) s", "target"),
                  (r"Run (\d+) \| Context ([^:]+): ([\d.]+) s", "context"),
                  (r"Run (\d+) \| Instance ([^:]+): ([\d.]+) s", "instance"),
                  (r"Instance (\d+): ([\d.]+) s", "single_instance"),
              ]

              for pattern, kind in patterns:
                  match = re.match(pattern, text)
                  if match:
                      if kind == "run":
                          return match.group(1), "", match.group(2)
                      if kind == "target":
                          return match.group(1), match.group(2), match.group(3)
                      if kind == "context":
                          return match.group(1), f"Context {match.group(2)}", match.group(3)
                      if kind == "instance":
                          return match.group(1), f"Instance {match.group(2)}", match.group(3)
                      if kind == "single_instance":
                          return "1", f"Instance {match.group(1)}", match.group(2)

              return None

          def parse_failed_line(text):
              patterns = [
                  (r"Run ที่ (\d+): โหลดไม่สำเร็จ", "run"),
                  (r"Run (\d+) \| Province ([^:]+): โหลดไม่สำเร็จ", "target"),
                  (r"Run (\d+) \| Geocode ([^:]+): โหลดไม่สำเร็จ", "target"),
                  (r"Run (\d+) \| Context ([^:]+): โหลดไม่สำเร็จ", "context"),
                  (r"Run (\d+) \| Instance ([^:]+): โหลดไม่สำเร็จ", "instance"),
                  (r"Instance ([^:]+): โหลดไม่สำเร็จ", "single_instance"),
              ]

              for pattern, kind in patterns:
                  match = re.match(pattern, text)
                  if match:
                      if kind == "run":
                          return match.group(1), ""
                      if kind == "target":
                          return match.group(1), match.group(2)
                      if kind == "context":
                          return match.group(1), f"Context {match.group(2)}"
                      if kind == "instance":
                          return match.group(1), f"Instance {match.group(2)}"
                      if kind == "single_instance":
                          return "1", f"Instance {match.group(1)}"

              return None

          def parse_error_summary(text):
              if re.search(r": [\d.]+ s$", text):
                  return None

              match = re.match(
                  r"^(Run \d+(?: \| [^:]+)*|Instance \d+|Context \d+): (.*?) \| (.*)$",
                  text,
              )

              if match:
                  return match.group(1), match.group(2), match.group(3)

              match = re.match(
                  r"^(Run \d+(?: \| [^:]+)*|Instance \d+|Context \d+): (.*)$",
                  text,
              )

              if match and "โหลด" in match.group(2):
                  return match.group(1), "ERROR", match.group(2)

              return None

          for test_name, sheet_name in files:
              ws = wb.create_sheet(title=sheet_name)
              ws.append(headers)

              for cell in ws[1]:
                  cell.fill = header_fill
                  cell.font = bold_font
                  cell.alignment = Alignment(horizontal="center")

              report_path = f"reports/{test_name}-report.txt"

              rows = []
              error_map = {}

              success_count = ""
              failed_count = ""
              total_time = ""
              average_time = ""
              median_time = ""
              min_time = ""
              max_time = ""

              if os.path.exists(report_path):
                  with open(report_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()
              else:
                  lines = []

              for line in lines:
                  text = line.strip()

                  success_result = parse_success_line(text)
                  failed_result = parse_failed_line(text)
                  error_result = parse_error_summary(text)

                  if success_result:
                      run_no, target, load_time = success_result
                      rows.append({
                          "run_no": run_no,
                          "target": target,
                          "load_time": load_time,
                          "error_type": "",
                          "error_detail": "",
                      })

                  elif failed_result:
                      run_no, target = failed_result
                      rows.append({
                          "run_no": run_no,
                          "target": target,
                          "load_time": "FAILED",
                          "error_type": "",
                          "error_detail": "",
                      })

                  if error_result:
                      key, error_type, error_detail = error_result
                      error_map[key] = {
                          "error_type": error_type,
                          "error_detail": error_detail,
                      }

                  if (
                      text.startswith("Success Runs")
                      or text.startswith("Success Pages")
                      or text.startswith("Success Contexts")
                  ):
                      success_count = text.split(":", 1)[1].strip()

                  if (
                      text.startswith("Failed Runs")
                      or text.startswith("Failed Pages")
                      or text.startswith("Failed Contexts")
                  ):
                      failed_count = text.split(":", 1)[1].strip()

                  if text.startswith("Total Time"):
                      total_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Average Time"):
                      average_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Median Time"):
                      median_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Min Time"):
                      min_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Max Time"):
                      max_time = text.split(":", 1)[1].replace("s", "").strip()

              for row in rows:
                  error_keys = [
                      f'Run {row["run_no"]} | {row["target"]}',
                      f'Run {row["run_no"]}',
                      row["target"],
                  ]

                  for key in error_keys:
                      if key in error_map:
                          row["error_type"] = error_map[key]["error_type"]
                          row["error_detail"] = error_map[key]["error_detail"]
                          break

                  ws.append([
                      run_date,
                      current_time,
                      row["run_no"],
                      row["target"],
                      row["load_time"],
                      "",
                      "",
                      "",
                      "",
                      "",
                      "",
                      "",
                      row["error_type"],
                      row["error_detail"],
                  ])

                  if row["load_time"] == "FAILED":
                      for cell in ws[ws.max_row]:
                          cell.fill = fail_fill

              ws.append([
                  run_date,
                  current_time,
                  "SUMMARY",
                  "",
                  "",
                  success_count,
                  failed_count,
                  total_time,
                  average_time,
                  median_time,
                  min_time,
                  max_time,
                  "",
                  "",
              ])

              for cell in ws[ws.max_row]:
                  cell.fill = summary_fill
                  cell.font = bold_font

              for col in range(1, len(headers) + 1):
                  ws.column_dimensions[get_column_letter(col)].width = 25

              ws.freeze_panes = "A2"

          filename = datetime.now(ZoneInfo("Asia/Bangkok")).strftime(
              "performance-report-%Y-%m-%d-%H-%M.xlsx"
          )

          wb.save(filename)
          print(f"Created Excel file: {filename}")
          PY

      - name: Upload Excel performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-performance-report
          path: performance-report-*.xlsx

      - name: Upload text reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-performance-reports
          path: reports/*.txt

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-screenshots
          path: reports/screenshots