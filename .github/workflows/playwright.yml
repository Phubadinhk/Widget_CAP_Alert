name: Performance Test

on:
  schedule:
    - cron: "11 23 * * *" # 06:11 ไทย
    - cron: "32 8 * * *" # 15:32 ไทย
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    env:
      KIOSK_TOKEN: ${{ secrets.KIOSK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Set run start time
        shell: bash
        run: |
          echo "RUN_START_TIME=$(TZ='Asia/Bangkok' date '+%d/%m/%Y %H:%M:%S')" >> $GITHUB_ENV
          echo "RUN_START_TIME_ONLY=$(TZ='Asia/Bangkok' date '+%H:%M:%S')" >> $GITHUB_ENV
          echo "RUN_DATE=$(TZ='Asia/Bangkok' date '+%d/%m/%Y')" >> $GITHUB_ENV
          echo "RUN_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
          echo "ARTIFACT_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" >> $GITHUB_ENV

      - name: Run performance tests
        shell: bash
        run: |
          mkdir -p reports
          mkdir -p blob-reports

          TEST_FILES=(
            "home"
            "alert_history"
            "danger"
            "five-day"
            "rainfall"
            "temperature"
            "weather_province"
          )

          OVERALL_EXIT_CODE=0

          for TEST_NAME in "${TEST_FILES[@]}"; do
            echo "===== Running tests/${TEST_NAME}.spec.ts ====="

            rm -rf blob-report

            set +e
            npx playwright test "tests/${TEST_NAME}.spec.ts" --reporter=line,blob | tee "reports/${TEST_NAME}-report.txt"
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            set -e

            echo "$TEST_EXIT_CODE" > "reports/${TEST_NAME}-status.txt"

            if [ -d "blob-report" ]; then
              mv blob-report/*.zip "blob-reports/${TEST_NAME}.zip"
            fi

            if [ "$TEST_EXIT_CODE" -ne 0 ]; then
              OVERALL_EXIT_CODE=1
            fi
          done

          echo "===== Merge Playwright HTML Report ====="
          rm -rf playwright-report

          if [ "$(ls -A blob-reports 2>/dev/null)" ]; then
            npx playwright merge-reports --reporter=html blob-reports
          else
            echo "No blob reports found"
          fi

          exit $OVERALL_EXIT_CODE

      - name: Create Excel performance report
        if: always()
        shell: bash
        run: |
          pip install openpyxl

          python - <<'PY'
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from openpyxl import Workbook
          from openpyxl.styles import PatternFill, Font, Alignment
          from openpyxl.utils import get_column_letter

          run_date = os.environ["RUN_DATE"]
          current_time = os.environ["RUN_START_TIME_ONLY"]

          files = [
              ("home", "MainPage"),
              ("alert_history", "DisasterAlertHistory"),
              ("danger", "DangerSituation"),
              ("five-day", "wrf5Day"),
              ("rainfall", "CumulativeRainfall"),
              ("temperature", "wrf24hr"),
              ("weather_province", "WeatherByProvincePage"),
          ]

          wb = Workbook()
          wb.remove(wb.active)

          headers = [
              "RunDate",
              "ScheduleTime",
              "RunNo",
              "LoadTimeSec",
              "ErrorType",
              "ErrorDetail",
              "SuccessRuns",
              "FailedRuns",
              "TotalTimeSec",
              "AverageTimeSec",
              "MedianTimeSec",
              "MinTimeSec",
              "MaxTimeSec",
          ]

          header_fill = PatternFill(start_color="D9EAF7", end_color="D9EAF7", fill_type="solid")
          summary_fill = PatternFill(start_color="FFF2CC", end_color="FFF2CC", fill_type="solid")
          fail_fill = PatternFill(start_color="F4CCCC", end_color="F4CCCC", fill_type="solid")
          bold_font = Font(bold=True)

          for test_name, sheet_name in files:
              ws = wb.create_sheet(title=sheet_name)
              ws.append(headers)

              for cell in ws[1]:
                  cell.fill = header_fill
                  cell.font = bold_font
                  cell.alignment = Alignment(horizontal="center")

              report_path = f"reports/{test_name}-report.txt"

              rows = []
              error_map = {}

              success_runs = ""
              failed_runs = ""
              total_time = ""
              average_time = ""
              median_time = ""
              min_time = ""
              max_time = ""

              lines = []

              if os.path.exists(report_path):
                  with open(report_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()

              for line in lines:
                  text = line.strip()

                  success_match = re.match(r"Run ที่ (\d+): ([\d.]+) s", text)
                  fail_match = re.match(r"Run ที่ (\d+): โหลดไม่สำเร็จ", text)
                  error_summary_match = re.match(r"Run (\d+): (.*?) \| (.*)", text)

                  if success_match:
                      rows.append({
                          "run_no": success_match.group(1),
                          "load_time": success_match.group(2),
                          "error_type": "",
                          "error_detail": "",
                      })

                  elif fail_match:
                      rows.append({
                          "run_no": fail_match.group(1),
                          "load_time": "FAILED",
                          "error_type": "",
                          "error_detail": "",
                      })

                  elif error_summary_match:
                      run_no = error_summary_match.group(1)
                      error_map[run_no] = {
                          "error_type": error_summary_match.group(2),
                          "error_detail": error_summary_match.group(3),
                      }

                  if text.startswith("Success Runs"):
                      success_runs = text.split(":", 1)[1].strip()

                  if text.startswith("Failed Runs"):
                      failed_runs = text.split(":", 1)[1].strip()

                  if text.startswith("Total Time"):
                      total_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Average Time"):
                      average_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Median Time"):
                      median_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Min Time"):
                      min_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Max Time"):
                      max_time = text.split(":", 1)[1].replace("s", "").strip()

              for row in rows:
                  run_no = row["run_no"]

                  if run_no in error_map:
                      row["error_type"] = error_map[run_no]["error_type"]
                      row["error_detail"] = error_map[run_no]["error_detail"]

                  ws.append([
                      run_date,
                      current_time,
                      run_no,
                      row["load_time"],
                      row["error_type"],
                      row["error_detail"],
                      "",
                      "",
                      "",
                      "",
                      "",
                      "",
                      "",
                  ])

                  if row["load_time"] == "FAILED":
                      for cell in ws[ws.max_row]:
                          cell.fill = fail_fill

              ws.append([
                  run_date,
                  current_time,
                  "SUMMARY",
                  "",
                  "",
                  "",
                  success_runs,
                  failed_runs,
                  total_time,
                  average_time,
                  median_time,
                  min_time,
                  max_time,
              ])

              for cell in ws[ws.max_row]:
                  cell.fill = summary_fill
                  cell.font = bold_font

              for col in range(1, len(headers) + 1):
                  ws.column_dimensions[get_column_letter(col)].width = 25

              ws.freeze_panes = "A2"

          filename = datetime.now(
              ZoneInfo("Asia/Bangkok")
          ).strftime("performance-report-%Y-%m-%d-%H-%M.xlsx")

          wb.save(filename)
          print(f"Created Excel file: {filename}")
          PY

      - name: Upload Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-excel
          path: performance-report-*.xlsx
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-performance-report
          path: |
            playwright-report/
            reports/
            blob-reports/
          retention-days: 7

      - name: Send summary to Microsoft Teams
        if: always()
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          RUN_END_TIME=$(TZ='Asia/Bangkok' date '+%d/%m/%Y %H:%M:%S')
          export RUN_END_TIME

          python - <<'PY'
          import json
          import os
          import re

          run_start_time = os.environ["RUN_START_TIME"]
          run_end_time = os.environ["RUN_END_TIME"]
          status = os.environ["STATUS"]
          run_url = os.environ["RUN_URL"]
          artifact_url = os.environ["ARTIFACT_URL"]

          files = [
              ("home", "MainPage"),
              ("alert_history", "DisasterAlertHistory"),
              ("danger", "DangerSituation"),
              ("five-day", "wrf5Day"),
              ("rainfall", "CumulativeRainfall"),
              ("temperature", "wrf24hr"),
              ("weather_province", "WeatherByProvincePage"),
          ]

          summary_text = ""

          for test_name, display_name in files:
              report_path = f"reports/{test_name}-report.txt"

              success_runs = "N/A"
              failed_runs = "N/A"
              total_time = "N/A"
              average_time = "N/A"
              median_time = "N/A"
              min_time = "N/A"
              max_time = "N/A"
              error_summary = []

              if os.path.exists(report_path):
                  with open(report_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()

                  for line in lines:
                      text = line.strip()

                      if text.startswith("Success Runs"):
                          success_runs = text.replace("Success Runs:", "").strip()

                      if text.startswith("Failed Runs"):
                          failed_runs = text.replace("Failed Runs:", "").strip()

                      if text.startswith("Total Time"):
                          total_time = text.replace("Total Time:", "").strip()

                      if text.startswith("Average Time"):
                          average_time = text.replace("Average Time:", "").strip()

                      if text.startswith("Median Time"):
                          median_time = text.replace("Median Time:", "").strip()

                      if text.startswith("Min Time"):
                          min_time = text.replace("Min Time:", "").strip()

                      if text.startswith("Max Time"):
                          max_time = text.replace("Max Time:", "").strip()

                      error_match = re.match(r"Run (\d+): (.*?) \|", text)

                      if error_match:
                          run_no = error_match.group(1)
                          error_type = error_match.group(2)
                          error_summary.append(f"Run {run_no}: {error_type}")

              error_text = "No Errors"

              if error_summary:
                  error_text = "\n".join(error_summary[:10])

              summary_text += (
                  f"{display_name}\n"
                  f"Success Runs: {success_runs}\n"
                  f"Failed Runs: {failed_runs}\n"
                  f"Total Time: {total_time}\n"
                  f"Average Time: {average_time}\n"
                  f"Median Time: {median_time}\n"
                  f"Min Time: {min_time}\n"
                  f"Max Time: {max_time}\n"
                  f"Error Summary:\n{error_text}\n\n"
              )

          payload = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                  {
                      "type": "TextBlock",
                      "text": "Playwright Performance Summary",
                      "weight": "Bolder",
                      "size": "Medium"
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Status: {status}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run Start (TH): {run_start_time}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run End (TH): {run_end_time}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run Report: {run_url}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Artifacts: {artifact_url}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": summary_text,
                      "wrap": True,
                      "size": "Small"
                  }
              ]
          }

          with open("teams-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          curl -X POST \
            -H "Content-Type: application/json" \
            -d @teams-payload.json \
            "$TEAMS_WEBHOOK_URL"