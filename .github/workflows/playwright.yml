name: Performance Test

on:
  schedule:
    - cron: "11 0 * * *" # 07:11 ไทย
    - cron: "32 8 * * *" # 15:32 ไทย
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    env:
      KIOSK_TOKEN: ${{ secrets.KIOSK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Set run start time
        shell: bash
        run: |
          echo "RUN_START_TIME=$(TZ='Asia/Bangkok' date '+%d/%m/%Y %H:%M:%S')" >> $GITHUB_ENV
          echo "RUN_START_TIME_ONLY=$(TZ='Asia/Bangkok' date '+%H:%M:%S')" >> $GITHUB_ENV
          echo "RUN_DATE=$(TZ='Asia/Bangkok' date '+%d/%m/%Y')" >> $GITHUB_ENV
          echo "RUN_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
          echo "ARTIFACT_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" >> $GITHUB_ENV

      - name: Run performance tests
        shell: bash
        run: |
          mkdir -p reports
          mkdir -p blob-reports

          TEST_FILES=(
            "home"
            "alert_history"
            "danger"
            "five-day"
            "rainfall"
            "temperature"
            "weather_province"
          )

          OVERALL_EXIT_CODE=0

          for TEST_NAME in "${TEST_FILES[@]}"; do
            echo "===== Running tests/${TEST_NAME}.spec.ts ====="

            rm -rf blob-report

            set +e
            npx playwright test "tests/${TEST_NAME}.spec.ts" --reporter=list,blob 2>&1 | tee "reports/${TEST_NAME}-report.txt"
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            set -e

            echo "$TEST_EXIT_CODE" > "reports/${TEST_NAME}-status.txt"

            if [ -d "blob-report" ]; then
              mv blob-report/*.zip "blob-reports/${TEST_NAME}.zip" || true
            fi

            if [ "$TEST_EXIT_CODE" -ne 0 ]; then
              OVERALL_EXIT_CODE=1
            fi
          done

          echo "===== Merge Playwright HTML Report ====="

          rm -rf playwright-report

          if [ "$(ls -A blob-reports 2>/dev/null)" ]; then
            npx playwright merge-reports --reporter=html blob-reports
          else
            echo "No blob reports found"
          fi

          exit $OVERALL_EXIT_CODE

      - name: Capture Playwright report screenshot
        if: always()
        shell: bash
        run: |
          mkdir -p report-screenshots

          if [ -f "playwright-report/index.html" ]; then
            npx playwright screenshot \
              --full-page \
              "file://$PWD/playwright-report/index.html" \
              "report-screenshots/playwright-report.png"
          else
            echo "playwright-report/index.html not found"
          fi

      - name: Create Excel performance report
        if: always()
        shell: bash
        run: |
          pip install openpyxl

          python - <<'PY'
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from openpyxl import Workbook
          from openpyxl.styles import PatternFill, Font, Alignment
          from openpyxl.utils import get_column_letter

          run_date = os.environ["RUN_DATE"]
          current_time = os.environ["RUN_START_TIME_ONLY"]

          files = [
              ("home", "MainPage"),
              ("alert_history", "DisasterAlertHistory"),
              ("danger", "DangerSituation"),
              ("five-day", "wrf5Day"),
              ("rainfall", "CumulativeRainfall"),
              ("temperature", "wrf24hr"),
              ("weather_province", "WeatherByProvincePage"),
          ]

          wb = Workbook()
          wb.remove(wb.active)

          headers = [
              "RunDate",
              "ScheduleTime",
              "RunNo",
              "Target",
              "LoadTimeSec",
              "ErrorType",
              "ErrorDetail",
              "Success",
              "Failed",
              "TotalTimeSec",
              "AverageTimeSec",
              "MedianTimeSec",
              "MinTimeSec",
              "MaxTimeSec",
          ]

          header_fill = PatternFill(start_color="D9EAF7", end_color="D9EAF7", fill_type="solid")
          summary_fill = PatternFill(start_color="FFF2CC", end_color="FFF2CC", fill_type="solid")
          fail_fill = PatternFill(start_color="F4CCCC", end_color="F4CCCC", fill_type="solid")
          bold_font = Font(bold=True)

          def parse_success_line(text):
            patterns = [
                (r"Run ที่ (\d+): ([\d.]+) s", "run"),
                (r"Run (\d+) \| Province ([^:]+): ([\d.]+) s", "target"),
                (r"Run (\d+) \| Geocode ([^:]+): ([\d.]+) s", "target"),
                (r"Run (\d+) \| Instance ([^:]+): ([\d.]+) s", "target"),
                (r"Run (\d+) \| .*?Instance ([^:]+): ([\d.]+) s", "target"),
                (r"Instance (\d+): ([\d.]+) s", "instance"),
            ]

            for pattern, kind in patterns:
                match = re.match(pattern, text)

                if match:
                    if kind == "run":
                        return match.group(1), "", match.group(2)

                    if kind == "target":
                        return match.group(1), match.group(2), match.group(3)

                    if kind == "instance":
                        return "1", f"Instance {match.group(1)}", match.group(2)

            return None
          def parse_failed_line(text):
              patterns = [
                  r"Run ที่ (\d+): โหลดไม่สำเร็จ",
                  r"Run (\d+) \| Province ([^:]+): โหลดไม่สำเร็จ",
                  r"Run (\d+) \| Geocode ([^:]+): โหลดไม่สำเร็จ",
                  r"Run (\d+) \| Instance ([^:]+): โหลดไม่สำเร็จ",
                  r"Instance ([^:]+): โหลดไม่สำเร็จ",
              ]

              for pattern in patterns:
                  match = re.match(pattern, text)
                  if match:
                      groups = match.groups()
                      if len(groups) == 1:
                          return groups[0], ""
                      return groups[0], groups[1]

              return None

          for test_name, sheet_name in files:
              ws = wb.create_sheet(title=sheet_name)
              ws.append(headers)

              for cell in ws[1]:
                  cell.fill = header_fill
                  cell.font = bold_font
                  cell.alignment = Alignment(horizontal="center")

              report_path = f"reports/{test_name}-report.txt"

              rows = []
              error_map = {}

              success_count = ""
              failed_count = ""
              total_time = ""
              average_time = ""
              median_time = ""
              min_time = ""
              max_time = ""

              lines = []

              if os.path.exists(report_path):
                  with open(report_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()

              for line in lines:
                  text = line.strip()

                  success_result = parse_success_line(text)
                  failed_result = parse_failed_line(text)

                  if success_result:
                      run_no, target, load_time = success_result
                      rows.append({
                          "run_no": run_no,
                          "target": target,
                          "load_time": load_time,
                          "error_type": "",
                          "error_detail": "",
                      })

                  elif failed_result:
                      run_no, target = failed_result
                      rows.append({
                          "run_no": run_no,
                          "target": target,
                          "load_time": "FAILED",
                          "error_type": "",
                          "error_detail": "",
                      })

                  error_summary_match = re.match(
                      r"(Run \d+.*?|Instance \d+): (.*?) \| (.*)",
                      text
                  )

                  if error_summary_match:
                      key = error_summary_match.group(1)
                      error_map[key] = {
                          "error_type": error_summary_match.group(2),
                          "error_detail": error_summary_match.group(3),
                      }

                  if (
                      text.startswith("Success Runs")
                      or text.startswith("Success Pages")
                      or text.startswith("Success Contexts")
                  ):
                      success_count = text.split(":", 1)[1].strip()

                  if (
                      text.startswith("Failed Runs")
                      or text.startswith("Failed Pages")
                      or text.startswith("Failed Contexts")
                  ):
                      failed_count = text.split(":", 1)[1].strip()

                  if text.startswith("Total Time"):
                      total_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Average Time"):
                      average_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Median Time"):
                      median_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Min Time"):
                      min_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Max Time"):
                      max_time = text.split(":", 1)[1].replace("s", "").strip()

              for row in rows:
                  ws.append([
                      run_date,
                      current_time,
                      row["run_no"],
                      row["target"],
                      row["load_time"],
                      row["error_type"],
                      row["error_detail"],
                      "",
                      "",
                      "",
                      "",
                      "",
                      "",
                      "",
                  ])

                  if row["load_time"] == "FAILED":
                      for cell in ws[ws.max_row]:
                          cell.fill = fail_fill

              ws.append([
                  run_date,
                  current_time,
                  "SUMMARY",
                  "",
                  "",
                  "",
                  "",
                  success_count,
                  failed_count,
                  total_time,
                  average_time,
                  median_time,
                  min_time,
                  max_time,
              ])

              for cell in ws[ws.max_row]:
                  cell.fill = summary_fill
                  cell.font = bold_font

              for col in range(1, len(headers) + 1):
                  ws.column_dimensions[get_column_letter(col)].width = 25

              ws.freeze_panes = "A2"

          filename = datetime.now(ZoneInfo("Asia/Bangkok")).strftime(
              "performance-report-%Y-%m-%d-%H-%M.xlsx"
          )

          wb.save(filename)
          print(f"Created Excel file: {filename}")
          PY

      - name: Upload Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-excel
          path: performance-report-*.xlsx
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-performance-report
          path: |
            playwright-report/
            reports/
            blob-reports/
            report-screenshots/
          retention-days: 7

      - name: Send summary to Microsoft Teams
        if: always()
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          RUN_END_TIME=$(TZ='Asia/Bangkok' date '+%d/%m/%Y %H:%M:%S')
          export RUN_END_TIME

          python - <<'PY'
          import json
          import os
          import re

          run_start_time = os.environ["RUN_START_TIME"]
          run_end_time = os.environ["RUN_END_TIME"]
          status = os.environ["STATUS"]
          run_url = os.environ["RUN_URL"]
          artifact_url = os.environ["ARTIFACT_URL"]

          files = [
              ("home", "MainPage"),
              ("alert_history", "DisasterAlertHistory"),
              ("danger", "DangerSituation"),
              ("five-day", "wrf5Day"),
              ("rainfall", "CumulativeRainfall"),
              ("temperature", "wrf24hr"),
              ("weather_province", "WeatherByProvincePage"),
          ]

          summary_text = ""

          for test_name, display_name in files:
              report_path = f"reports/{test_name}-report.txt"

              success_count = "N/A"
              failed_count = "N/A"
              total_time = "N/A"
              average_time = "N/A"
              median_time = "N/A"
              min_time = "N/A"
              max_time = "N/A"
              error_summary = []

              if os.path.exists(report_path):
                  with open(report_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()

                  for line in lines:
                      text = line.strip()

                      if (
                          text.startswith("Success Runs")
                          or text.startswith("Success Pages")
                          or text.startswith("Success Contexts")
                      ):
                          success_count = text.split(":", 1)[1].strip()

                      if (
                          text.startswith("Failed Runs")
                          or text.startswith("Failed Pages")
                          or text.startswith("Failed Contexts")
                      ):
                          failed_count = text.split(":", 1)[1].strip()

                      if text.startswith("Total Time"):
                          total_time = text.split(":", 1)[1].strip()

                      if text.startswith("Average Time"):
                          average_time = text.split(":", 1)[1].strip()

                      if text.startswith("Median Time"):
                          median_time = text.split(":", 1)[1].strip()

                      if text.startswith("Min Time"):
                          min_time = text.split(":", 1)[1].strip()

                      if text.startswith("Max Time"):
                          max_time = text.split(":", 1)[1].strip()

                      error_match = re.match(
                          r"(Run \d+.*?|Instance \d+): (.*?) \|",
                          text
                      )

                      if error_match:
                          error_summary.append(
                              f"{error_match.group(1)}: {error_match.group(2)}"
                          )

              error_text = "No Errors"

              if error_summary:
                  error_text = "\n".join(error_summary[:10])

              summary_text += (
                  f"{display_name}\n"
                  f"Success: {success_count}\n"
                  f"Failed: {failed_count}\n"
                  f"Total Time: {total_time}\n"
                  f"Average Time: {average_time}\n"
                  f"Median Time: {median_time}\n"
                  f"Min Time: {min_time}\n"
                  f"Max Time: {max_time}\n"
                  f"Error Summary:\n{error_text}\n\n"
              )

          payload = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                  {
                      "type": "TextBlock",
                      "text": "Playwright Performance Summary",
                      "weight": "Bolder",
                      "size": "Medium"
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Status: {status}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run Start (TH): {run_start_time}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run End (TH): {run_end_time}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run Report: {run_url}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Artifacts: {artifact_url}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": summary_text,
                      "wrap": True,
                      "size": "Small"
                  }
              ]
          }

          with open("teams-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)

          PY

          curl -X POST \
            -H "Content-Type: application/json" \
            -d @teams-payload.json \
            "$TEAMS_WEBHOOK_URL"
