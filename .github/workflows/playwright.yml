name: Performance Test

on:
  schedule:
    - cron: "11 22 * * *" # 05:11 ไทย
    - cron: "32 8 * * *"  # 15:32 ไทย
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    env:
      KIOSK_TOKEN: ${{ secrets.KIOSK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run performance tests
        shell: bash
        run: |
          mkdir -p reports

          TEST_FILES=(
            "home"
            "alert_history"
            "danger"
            "five-day"
            "rainfall"
            "temperature"
            "weather_province"
          )

          OVERALL_EXIT_CODE=0

          for TEST_NAME in "${TEST_FILES[@]}"; do
            echo "===== Running tests/${TEST_NAME}.spec.ts ====="

            set +e
            npx playwright test "tests/${TEST_NAME}.spec.ts" | tee "reports/${TEST_NAME}-report.txt"
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            set -e

            echo "$TEST_EXIT_CODE" > "reports/${TEST_NAME}-status.txt"

            if [ "$TEST_EXIT_CODE" -ne 0 ]; then
              OVERALL_EXIT_CODE=1
            fi
          done

          exit $OVERALL_EXIT_CODE

      - name: Create Excel performance report
        if: always()
        shell: bash
        run: |
          pip install openpyxl

          RUN_DATE=$(TZ='Asia/Bangkok' date '+%d/%m/%Y')
          export RUN_DATE

          python - <<'PY'
          import os
          import re

          from datetime import datetime
          from zoneinfo import ZoneInfo

          from openpyxl import Workbook
          from openpyxl.styles import PatternFill, Font, Alignment
          from openpyxl.utils import get_column_letter

          run_date = os.environ["RUN_DATE"]

          current_time = datetime.now(
              ZoneInfo("Asia/Bangkok")
          ).strftime("%H:%M")

          files = [
              ("home", "Home"),
              ("alert_history", "AlertHistory"),
              ("danger", "Danger"),
              ("five-day", "FiveDay"),
              ("rainfall", "Rainfall"),
              ("temperature", "Temperature"),
              ("weather_province", "WeatherProvince"),
          ]

          wb = Workbook()

          default_sheet = wb.active
          wb.remove(default_sheet)

          headers = [
              "RunDate",
              "ScheduleTime",
              "RunNo",
              "LoadTimeSec",
              "TotalTimeSec",
              "AverageTimeSec"
          ]

          summary_fill = PatternFill(
              start_color="FFF2CC",
              end_color="FFF2CC",
              fill_type="solid"
          )

          header_fill = PatternFill(
              start_color="D9EAF7",
              end_color="D9EAF7",
              fill_type="solid"
          )

          bold_font = Font(bold=True)

          for test_name, sheet_name in files:

              ws = wb.create_sheet(title=sheet_name)

              ws.append(headers)

              for cell in ws[1]:
                  cell.fill = header_fill
                  cell.font = bold_font
                  cell.alignment = Alignment(horizontal="center")

              report_path = f"reports/{test_name}-report.txt"

              rows = []
              total_time = ""
              average_time = ""

              if os.path.exists(report_path):
                  with open(report_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()
              else:
                  lines = []

              for line in lines:

                  text = line.strip()

                  success_match = re.match(
                      r"Run ที่ (\d+): ([\d.]+) s",
                      text
                  )

                  fail_match = re.match(
                      r"Run ที่ (\d+): โหลดไม่สำเร็จ",
                      text
                  )

                  if success_match:
                      rows.append([
                          run_date,
                          current_time,
                          success_match.group(1),
                          success_match.group(2),
                          "",
                          ""
                      ])

                  elif fail_match:
                      rows.append([
                          run_date,
                          current_time,
                          fail_match.group(1),
                          "FAILED",
                          "",
                          ""
                      ])

                  if text.startswith("Total Time"):
                      total_time = text.split(":", 1)[1] \
                          .replace("s", "").strip()

                  if text.startswith("Average Time"):
                      average_time = text.split(":", 1)[1] \
                          .replace("s", "").strip()

              for row in rows:
                  ws.append(row)

              ws.append([
                  run_date,
                  current_time,
                  "SUMMARY",
                  "",
                  total_time,
                  average_time
              ])

              summary_row = ws.max_row

              for cell in ws[summary_row]:
                  cell.fill = summary_fill
                  cell.font = bold_font

              for col in range(1, len(headers) + 1):
                  ws.column_dimensions[
                      get_column_letter(col)
                  ].width = 20

              ws.freeze_panes = "A2"

          filename = datetime.now(
              ZoneInfo("Asia/Bangkok")
          ).strftime(
              "performance-report-%Y-%m-%d-%H-%M.xlsx"
          )

          wb.save(filename)

          print(f"Created Excel file: {filename}")

          PY

      - name: Upload Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-excel
          path: performance-report-*.xlsx
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-performance-report
          path: |
            playwright-report/
            reports/
          retention-days: 7

      - name: Send summary to Microsoft Teams
        if: always()
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          START_TIME=$(TZ='Asia/Bangkok' date '+%d/%m/%Y %H:%M:%S')
          export START_TIME

          python - <<'PY'
          import json
          import os

          status = os.environ["STATUS"]
          start_time = os.environ["START_TIME"]

          files = [
              ("home", "Home"),
              ("alert_history", "AlertHistory"),
              ("danger", "Danger"),
              ("five-day", "FiveDay"),
              ("rainfall", "Rainfall"),
              ("temperature", "Temperature"),
              ("weather_province", "WeatherProvince"),
          ]

          summary_text = ""

          for test_name, display_name in files:

              report_path = f"reports/{test_name}-report.txt"

              success_runs = "N/A"
              total_time = "N/A"
              average_time = "N/A"

              if os.path.exists(report_path):

                  with open(report_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()

                  for line in lines:

                      text = line.strip()

                      if text.startswith("Success Runs"):
                          success_runs = text.replace(
                              "Success Runs:",
                              ""
                          ).strip()

                      if text.startswith("Total Time"):
                          total_time = text.replace(
                              "Total Time:",
                              ""
                          ).strip()

                      if text.startswith("Average Time"):
                          average_time = text.replace(
                              "Average Time:",
                              ""
                          ).strip()

              summary_text += (
                  f"{display_name}\n"
                  f"Success Runs: {success_runs}\n"
                  f"Total Time: {total_time}\n"
                  f"Average Time: {average_time}\n\n"
              )

          payload = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                  {
                      "type": "TextBlock",
                      "text": "Playwright Performance Summary",
                      "weight": "Bolder",
                      "size": "Medium"
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Status: {status}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run DateTime (TH): {start_time}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": summary_text,
                      "wrap": True,
                      "size": "Small"
                  }
              ]
          }

          with open(
              "teams-payload.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(payload, f, ensure_ascii=False)

          PY

          curl -X POST \
            -H "Content-Type: application/json" \
            -d @teams-payload.json \
            "$TEAMS_WEBHOOK_URL"