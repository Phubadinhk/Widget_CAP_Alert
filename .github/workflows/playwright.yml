name: Performance Test

on:
  schedule:
    - cron: "11 0 * * *" # 07:11 ไทย
    - cron: "32 8 * * *" # 15:32 ไทย
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    env:
      KIOSK_TOKEN: ${{ secrets.KIOSK_TOKEN }}
      RUN_DATE: ${{ github.run_id }}
      RUN_START_TIME_ONLY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Set run datetime
        shell: bash
        run: |
          echo "RUN_DATE=$(TZ=Asia/Bangkok date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "RUN_START_TIME_ONLY=$(TZ=Asia/Bangkok date +'%H:%M:%S')" >> $GITHUB_ENV

      - name: Prepare report folders
        shell: bash
        run: |
          mkdir -p reports
          mkdir -p reports/screenshots
          : > reports/test-status.txt

      - name: Run Home performance test
        shell: bash
        run: |
          set +e
          npx playwright test tests/home.spec.ts 2>&1 | tee reports/home-report.txt
          exit_code=${PIPESTATUS[0]}
          echo "home=$exit_code" >> reports/test-status.txt
          exit 0

      - name: Run Alert History performance test
        shell: bash
        run: |
          set +e
          npx playwright test tests/alert_history.spec.ts 2>&1 | tee reports/alert_history-report.txt
          exit_code=${PIPESTATUS[0]}
          echo "alert_history=$exit_code" >> reports/test-status.txt
          exit 0

      - name: Run Danger performance test
        shell: bash
        run: |
          set +e
          npx playwright test tests/danger.spec.ts 2>&1 | tee reports/danger-report.txt
          exit_code=${PIPESTATUS[0]}
          echo "danger=$exit_code" >> reports/test-status.txt
          exit 0

      - name: Run Five Day performance test
        shell: bash
        run: |
          set +e
          npx playwright test tests/five-day.spec.ts 2>&1 | tee reports/five-day-report.txt
          exit_code=${PIPESTATUS[0]}
          echo "five-day=$exit_code" >> reports/test-status.txt
          exit 0

      - name: Run Rainfall performance test
        shell: bash
        run: |
          set +e
          npx playwright test tests/rainfall.spec.ts 2>&1 | tee reports/rainfall-report.txt
          exit_code=${PIPESTATUS[0]}
          echo "rainfall=$exit_code" >> reports/test-status.txt
          exit 0

      - name: Run Temperature performance test
        shell: bash
        run: |
          set +e
          npx playwright test tests/temperature.spec.ts 2>&1 | tee reports/temperature-report.txt
          exit_code=${PIPESTATUS[0]}
          echo "temperature=$exit_code" >> reports/test-status.txt
          exit 0

      - name: Run Weather Province performance test
        shell: bash
        run: |
          set +e
          npx playwright test tests/weather_province.spec.ts 2>&1 | tee reports/weather_province-report.txt
          exit_code=${PIPESTATUS[0]}
          echo "weather_province=$exit_code" >> reports/test-status.txt
          exit 0

      - name: Create Excel performance report
        if: always()
        shell: bash
        run: |
          pip install openpyxl

          python - <<'PY'
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from openpyxl import Workbook
          from openpyxl.styles import PatternFill, Font, Alignment
          from openpyxl.utils import get_column_letter

          run_date = os.environ.get("RUN_DATE", "")
          current_time = os.environ.get("RUN_START_TIME_ONLY", "")

          files = [
              ("home", "MainPage"),
              ("alert_history", "DisasterAlertHistory"),
              ("danger", "DangerSituation"),
              ("five-day", "wrf5Day"),
              ("rainfall", "CumulativeRainfall"),
              ("temperature", "wrf24hr"),
              ("weather_province", "WeatherByProvincePage"),
          ]

          wb = Workbook()
          wb.remove(wb.active)

          headers = [
              "RunDate",
              "ScheduleTime",
              "RunNo",
              "Target",
              "LoadTimeSec",
              "Success",
              "Failed",
              "TotalTimeSec",
              "AverageTimeSec",
              "MedianTimeSec",
              "MinTimeSec",
              "MaxTimeSec",
              "ErrorType",
              "ErrorDetail",
          ]

          header_fill = PatternFill(start_color="D9EAF7", end_color="D9EAF7", fill_type="solid")
          summary_fill = PatternFill(start_color="FFF2CC", end_color="FFF2CC", fill_type="solid")
          fail_fill = PatternFill(start_color="F4CCCC", end_color="F4CCCC", fill_type="solid")
          bold_font = Font(bold=True)

          def parse_success_line(text):
              patterns = [
                  (r"Run ที่ (\d+): ([\d.]+) s", "run"),
                  (r"Run (\d+) \| Province ([^:]+): ([\d.]+) s", "target"),
                  (r"Run (\d+) \| Geocode ([^:]+): ([\d.]+) s", "target"),
                  (r"Run (\d+) \| Context ([^:]+): ([\d.]+) s", "context"),
                  (r"Run (\d+) \| Instance ([^:]+): ([\d.]+) s", "instance"),
                  (r"Instance (\d+): ([\d.]+) s", "single_instance"),
              ]

              for pattern, kind in patterns:
                  match = re.match(pattern, text)
                  if match:
                      if kind == "run":
                          return match.group(1), "", match.group(2)
                      if kind == "target":
                          return match.group(1), match.group(2), match.group(3)
                      if kind == "context":
                          return match.group(1), f"Context {match.group(2)}", match.group(3)
                      if kind == "instance":
                          return match.group(1), f"Instance {match.group(2)}", match.group(3)
                      if kind == "single_instance":
                          return "1", f"Instance {match.group(1)}", match.group(2)

              return None

          def parse_failed_line(text):
              patterns = [
                  (r"Run ที่ (\d+): โหลดไม่สำเร็จ", "run"),
                  (r"Run (\d+) \| Province ([^:]+): โหลดไม่สำเร็จ", "target"),
                  (r"Run (\d+) \| Geocode ([^:]+): โหลดไม่สำเร็จ", "target"),
                  (r"Run (\d+) \| Context ([^:]+): โหลดไม่สำเร็จ", "context"),
                  (r"Run (\d+) \| Instance ([^:]+): โหลดไม่สำเร็จ", "instance"),
                  (r"Instance ([^:]+): โหลดไม่สำเร็จ", "single_instance"),
              ]

              for pattern, kind in patterns:
                  match = re.match(pattern, text)
                  if match:
                      if kind == "run":
                          return match.group(1), ""
                      if kind == "target":
                          return match.group(1), match.group(2)
                      if kind == "context":
                          return match.group(1), f"Context {match.group(2)}"
                      if kind == "instance":
                          return match.group(1), f"Instance {match.group(2)}"
                      if kind == "single_instance":
                          return "1", f"Instance {match.group(1)}"

              return None

          def parse_error_summary(text):
              if re.search(r": [\d.]+ s$", text):
                  return None

              match = re.match(
                  r"^(Run \d+(?: \| [^:]+)*|Instance \d+|Context \d+): (.*?) \| (.*)$",
                  text,
              )

              if match:
                  return match.group(1), match.group(2), match.group(3)

              match = re.match(
                  r"^(Run \d+(?: \| [^:]+)*|Instance \d+|Context \d+): (.*)$",
                  text,
              )

              if match and "โหลด" in match.group(2):
                  return match.group(1), "ERROR", match.group(2)

              return None

          for test_name, sheet_name in files:
              ws = wb.create_sheet(title=sheet_name)
              ws.append(headers)

              for cell in ws[1]:
                  cell.fill = header_fill
                  cell.font = bold_font
                  cell.alignment = Alignment(horizontal="center")

              report_path = f"reports/{test_name}-report.txt"

              rows = []
              error_map = {}

              success_count = ""
              failed_count = ""
              total_time = ""
              average_time = ""
              median_time = ""
              min_time = ""
              max_time = ""

              if os.path.exists(report_path):
                  with open(report_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()
              else:
                  lines = []

              for line in lines:
                  text = line.strip()

                  success_result = parse_success_line(text)
                  failed_result = parse_failed_line(text)
                  error_result = parse_error_summary(text)

                  if success_result:
                      run_no, target, load_time = success_result
                      rows.append({
                          "run_no": run_no,
                          "target": target,
                          "load_time": load_time,
                          "error_type": "",
                          "error_detail": "",
                      })

                  elif failed_result:
                      run_no, target = failed_result
                      rows.append({
                          "run_no": run_no,
                          "target": target,
                          "load_time": "FAILED",
                          "error_type": "",
                          "error_detail": "",
                      })

                  if error_result:
                      key, error_type, error_detail = error_result
                      error_map[key] = {
                          "error_type": error_type,
                          "error_detail": error_detail,
                      }

                  if (
                      text.startswith("Success Runs")
                      or text.startswith("Success Pages")
                      or text.startswith("Success Contexts")
                  ):
                      success_count = text.split(":", 1)[1].strip()

                  if (
                      text.startswith("Failed Runs")
                      or text.startswith("Failed Pages")
                      or text.startswith("Failed Contexts")
                  ):
                      failed_count = text.split(":", 1)[1].strip()

                  if text.startswith("Total Time"):
                      total_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Average Time"):
                      average_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Median Time"):
                      median_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Min Time"):
                      min_time = text.split(":", 1)[1].replace("s", "").strip()

                  if text.startswith("Max Time"):
                      max_time = text.split(":", 1)[1].replace("s", "").strip()

              for row in rows:
                  error_keys = [
                      f'Run {row["run_no"]} | {row["target"]}',
                      f'Run {row["run_no"]}',
                      row["target"],
                  ]

                  for key in error_keys:
                      if key in error_map:
                          row["error_type"] = error_map[key]["error_type"]
                          row["error_detail"] = error_map[key]["error_detail"]
                          break

                  ws.append([
                      run_date,
                      current_time,
                      row["run_no"],
                      row["target"],
                      row["load_time"],
                      "",
                      "",
                      "",
                      "",
                      "",
                      "",
                      "",
                      row["error_type"],
                      row["error_detail"],
                  ])

                  if row["load_time"] == "FAILED":
                      for cell in ws[ws.max_row]:
                          cell.fill = fail_fill

              ws.append([
                  run_date,
                  current_time,
                  "SUMMARY",
                  "",
                  "",
                  success_count,
                  failed_count,
                  total_time,
                  average_time,
                  median_time,
                  min_time,
                  max_time,
                  "",
                  "",
              ])

              for cell in ws[ws.max_row]:
                  cell.fill = summary_fill
                  cell.font = bold_font

              for col in range(1, len(headers) + 1):
                  ws.column_dimensions[get_column_letter(col)].width = 25

              ws.freeze_panes = "A2"

          filename = datetime.now(ZoneInfo("Asia/Bangkok")).strftime(
              "performance-report-%Y-%m-%d-%H-%M.xlsx"
          )

          wb.save(filename)
          print(f"Created Excel file: {filename}")
          PY

      - name: Upload Excel performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-performance-report
          path: performance-report-*.xlsx

      - name: Upload text reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-performance-reports
          path: reports/*.txt

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-screenshots
          path: reports/screenshots

      - name: Send summary to Microsoft Teams
        if: always()
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RUN_END_TIME=$(TZ='Asia/Bangkok' date '+%d/%m/%Y %H:%M:%S')
          export RUN_END_TIME

          python - <<'PY'
          import json
          import os
          import re

          run_start_time = os.environ.get("RUN_START_TIME", os.environ.get("RUN_START_TIME_ONLY", "N/A"))
          run_end_time = os.environ.get("RUN_END_TIME", "N/A")
          status = os.environ.get("STATUS", "N/A")
          run_url = os.environ.get("RUN_URL", "N/A")
          artifact_url = os.environ.get("ARTIFACT_URL", "N/A")

          files = [
              ("home", "MainPage"),
              ("alert_history", "DisasterAlertHistory"),
              ("danger", "DangerSituation"),
              ("five-day", "wrf5Day"),
              ("rainfall", "CumulativeRainfall"),
              ("temperature", "wrf24hr"),
              ("weather_province", "WeatherByProvincePage"),
          ]

          summary_text = ""

          for test_name, display_name in files:
              report_path = f"reports/{test_name}-report.txt"

              success_count = "N/A"
              failed_count = "N/A"
              total_time = "N/A"
              average_time = "N/A"
              median_time = "N/A"
              min_time = "N/A"
              max_time = "N/A"
              error_summary = []

              if os.path.exists(report_path):
                  with open(report_path, "r", encoding="utf-8") as f:
                      lines = f.readlines()

                  for line in lines:
                      text = line.strip()

                      if (
                          text.startswith("Success Runs")
                          or text.startswith("Success Pages")
                          or text.startswith("Success Contexts")
                      ):
                          success_count = text.split(":", 1)[1].strip()

                      if (
                          text.startswith("Failed Runs")
                          or text.startswith("Failed Pages")
                          or text.startswith("Failed Contexts")
                      ):
                          failed_count = text.split(":", 1)[1].strip()

                      if text.startswith("Total Time"):
                          total_time = text.split(":", 1)[1].strip()

                      if text.startswith("Average Time"):
                          average_time = text.split(":", 1)[1].strip()

                      if text.startswith("Median Time"):
                          median_time = text.split(":", 1)[1].strip()

                      if text.startswith("Min Time"):
                          min_time = text.split(":", 1)[1].strip()

                      if text.startswith("Max Time"):
                          max_time = text.split(":", 1)[1].strip()

                      error_match = re.match(
                          r"(Run \d+.*?|Instance \d+|Context \d+): (.*?) \|",
                          text,
                      )

                      if error_match:
                          error_summary.append(
                              f"{error_match.group(1)}: {error_match.group(2)}"
                          )

              error_text = "No Errors"

              if error_summary:
                  error_text = "\n".join(error_summary[:10])

              summary_text += (
                  f"{display_name}\n"
                  f"Success: {success_count}\n"
                  f"Failed: {failed_count}\n"
                  f"Total Time: {total_time}\n"
                  f"Average Time: {average_time}\n"
                  f"Median Time: {median_time}\n"
                  f"Min Time: {min_time}\n"
                  f"Max Time: {max_time}\n"
                  f"Error Summary:\n{error_text}\n\n"
              )

          payload = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                  {
                      "type": "TextBlock",
                      "text": "Playwright Performance Summary",
                      "weight": "Bolder",
                      "size": "Medium"
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Status: {status}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run Start (TH): {run_start_time}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run End (TH): {run_end_time}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run Report: {run_url}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Artifacts: {artifact_url}",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": summary_text,
                      "wrap": True,
                      "size": "Small"
                  }
              ]
          }

          with open("teams-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)

          PY

          curl -X POST \
            -H "Content-Type: application/json" \
            -d @teams-payload.json \
            "$TEAMS_WEBHOOK_URL"
        if: always()
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import urllib.request

          webhook = os.environ.get("TEAMS_WEBHOOK_URL")

          if not webhook:
              raise Exception("Missing TEAMS_WEBHOOK_URL secret")

          now = datetime.now(
              ZoneInfo("Asia/Bangkok")
          ).strftime("%d/%m/%Y %H:%M:%S")

          files = [
              ("home", "MainPage"),
              ("alert_history", "DisasterAlertHistory"),
              ("danger", "DangerSituation"),
              ("five-day", "wrf5Day"),
              ("rainfall", "CumulativeRainfall"),
              ("temperature", "wrf24hr"),
              ("weather_province", "WeatherByProvincePage"),
          ]

          summary_lines = []

          for test_name, display_name in files:
              report_path = f"reports/{test_name}-report.txt"

              if not os.path.exists(report_path):
                  continue

              with open(report_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              success = ""
              failed = ""
              average = ""
              median = ""
              min_time = ""
              max_time = ""

              for line in lines:
                  text = line.strip()

                  if (
                      text.startswith("Success Runs")
                      or text.startswith("Success Pages")
                      or text.startswith("Success Contexts")
                  ):
                      success = text.split(":", 1)[1].strip()

                  if (
                      text.startswith("Failed Runs")
                      or text.startswith("Failed Pages")
                      or text.startswith("Failed Contexts")
                  ):
                      failed = text.split(":", 1)[1].strip()

                  if text.startswith("Average Time"):
                      average = text.split(":", 1)[1].strip()

                  if text.startswith("Median Time"):
                      median = text.split(":", 1)[1].strip()

                  if text.startswith("Min Time"):
                      min_time = text.split(":", 1)[1].strip()

                  if text.startswith("Max Time"):
                      max_time = text.split(":", 1)[1].strip()

              summary_lines.append(
                  f"""• {display_name}
          Success: {success}
          Failed: {failed}
          Avg: {average}
          Median: {median}
          Min: {min_time}
          Max: {max_time}"""
              )

          message = "\n\n".join(summary_lines)

          payload = {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "summary": "Performance Test Report",
              "themeColor": "0076D7",
              "title": "Performance Test Report",
              "sections": [
                  {
                      "activityTitle": f"Run Datetime (TH): {now}",
                      "text": f"<pre>{message}</pre>"
                  }
              ]
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )

          response = urllib.request.urlopen(req)

          print("Teams response:", response.status)
          PY

      - name: Check final performance result
        if: always()
        shell: bash
        run: |
          echo "Checking final performance result..."

          has_failed=0

          echo "Test status:"
          cat reports/test-status.txt || true

          if awk -F= '$2 != "0" { found=1 } END { exit found ? 0 : 1 }' reports/test-status.txt; then
            echo "Found failed Playwright test file."
            has_failed=1
          fi

          if grep -R -E "Failed (Pages|Runs|Contexts): [1-9][0-9]*/" reports/*.txt; then
            echo "Found failed performance cases."
            has_failed=1
          fi

          if grep -R -E "Performance test failed:" reports/*.txt; then
            echo "Found performance test failed error."
            has_failed=1
          fi

          if grep -R -E "Test timeout of|Error:|[0-9]+ failed" reports/*.txt; then
            echo "Found Playwright error or timeout."
            has_failed=1
          fi

          if [ "$has_failed" -eq 1 ]; then
            echo "Final result: FAILED"
            exit 1
          fi

          echo "Final result: PASSED"