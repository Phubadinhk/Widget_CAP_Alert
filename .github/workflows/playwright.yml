name: Performance Test

on:
  schedule:
    - cron: "30 1 * * *" # 08:30 ไทย
    - cron: "0 11 * * *" # 18:00 ไทย
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    env:
      KIOSK_TOKEN: ${{ secrets.KIOSK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run performance test
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/home.spec.ts | tee performance-report.txt

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-performance-report
          path: playwright-report/
          retention-days: 7

      - name: Send report to Microsoft Teams
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          START_TIME=$(TZ='Asia/Bangkok' date '+%d/%m/%Y %H:%M:%S')
          export START_TIME

          python - <<'PY'
          import json
          import os

          status = os.environ["STATUS"]
          run_url = os.environ["RUN_URL"]
          start_time = os.environ.get("START_TIME", "N/A")

          report = "No performance report found."

          if os.path.exists("performance-report.txt"):
              with open("performance-report.txt", "r", encoding="utf-8") as f:
                  lines = f.readlines()

              report_lines = [
                  line for line in lines
                  if line.startswith("Run ที่")
                  or line.startswith("Total Time")
                  or line.startswith("Average Time")
                  or line.startswith("----------------")
                  or line.startswith("Success Runs")
              ]

              if report_lines:
                  report = "".join(report_lines)

          payload = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                  {
                      "type": "TextBlock",
                      "text": "Playwright Performance Report",
                      "weight": "Bolder",
                      "size": "Small"
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Status: {status}",
                      "wrap": True,
                      "spacing": "Small",
                      "size": "Small"
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run DateTime (TH): {start_time}",
                      "wrap": True,
                      "spacing": "Small",
                      "size": "Small"
                  },
                  {
                      "type": "TextBlock",
                      "text": "Performance Result",
                      "weight": "Bolder",
                      "wrap": True,
                      "spacing": "Small",
                      "size": "Small"
                  },
                  {
                      "type": "TextBlock",
                      "text": report,
                      "wrap": True,
                      "size": "ExtraSmall",
                      "spacing": "None"
                  },
                  {
                      "type": "TextBlock",
                      "text": f"Run Report: {run_url}",
                      "wrap": True,
                      "spacing": "Small",
                      "size": "Small"
                  }
              ]
          }

          with open("teams-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          curl -X POST \
            -H "Content-Type: application/json" \
            -d @teams-payload.json \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"